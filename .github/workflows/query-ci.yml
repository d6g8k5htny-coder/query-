name: Query lookup and package controls
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run legacy compatibility controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -S -m unittest -v test_research_query.py test_catalog_entry_helper.py test_verify_portable_stubs.py
      - name: Run canonical package and deterministic-source controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -S -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify portable candidate stubs against pinned public commits
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S verify_portable_stubs.py
          python -B -S verify_portable_stubs.py --check-math-tip
