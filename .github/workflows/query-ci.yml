name: Query lookup controls
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run stdlib research_query controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S -m unittest -v test_research_query.py test_catalog_entry_helper.py test_verify_portable_stubs.py
          python -B -S - <<'PY'
          import hashlib, json, pathlib
          raw = pathlib.Path('research_query.py').read_bytes()
          print(json.dumps({
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'pinned_federation_match': (
                  len(raw) == 5577
                  and hashlib.sha256(raw).hexdigest()
                  == '54105dcd723e71b19263afc8f449a7d77b78cec27148f13603f33be7727e6b6b'
              ),
              'meaning': 'byte identity only; not catalog currentness or theorem acceptance',
          }, indent=2, sort_keys=True))
          PY
      - name: Verify portable candidate stubs against pinned public commits
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -S verify_portable_stubs.py
